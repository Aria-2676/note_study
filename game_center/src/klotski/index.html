<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华容道</title>
<style>
  :root { --bg:#1c1917; --panel:#292524; --accent:#dc2626; --text:#fef3c7; --muted:#a8a29e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  .stats { display:flex; gap:8px; }
  .stat { background:var(--panel); border-radius:8px; padding:6px 12px; text-align:center; min-width:62px; }
  .stat span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .stat strong { display:block; font-size:clamp(15px,4.2vw,20px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  .board-wrap {
    position:relative; padding:8px; background:#0c0a09; border-radius:12px;
    box-shadow:0 0 0 2px #44403c inset;
  }
  .board {
    position:relative; background:#1e293b; border-radius:6px;
    touch-action:none;
  }
  .grid-bg {
    position:absolute; inset:0; display:grid;
    background:#0c0a09; border-radius:6px;
  }
  .grid-bg .cell { border:1px dashed #334155; }
  .exit-mark {
    position:absolute; bottom:-2px; height:6px; border-radius:0 0 6px 6px;
    background:linear-gradient(180deg, transparent, var(--accent));
    pointer-events:none;
  }
  .piece {
    position:absolute; border:0; border-radius:6px; padding:0; margin:0;
    font-weight:800; color:#fff; cursor:pointer;
    transition:transform .18s ease, background .12s ease;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,7vw,32px);
  }
  .piece.cao { background:linear-gradient(135deg,#dc2626,#7f1d1d); border:2px solid #fca5a5; font-size:clamp(28px,9vw,40px); }
  .piece.general_v { background:linear-gradient(135deg,#2563eb,#1e3a8a); border:2px solid #93c5fd; }
  .piece.general_h { background:linear-gradient(135deg,#16a34a,#14532d); border:2px solid #86efac; }
  .piece.soldier { background:linear-gradient(135deg,#a16207,#713f12); border:2px solid #fde68a; }
  .piece:active, .piece.selected { filter:brightness(1.15); box-shadow:0 0 0 3px #fbbf24 inset; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.85);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:20px; }
  .card h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card p { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.7; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#fff;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">华容道</div>
    <div class="stats">
      <div class="stat"><span>步数</span><strong id="moves">0</strong></div>
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
      <div class="stat"><span>最佳</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>
    <div id="overlay" class="overlay">
      <div class="card">
        <h2 id="ov-title">华容道</h2>
        <p id="ov-desc">把 曹 滑动到底部出口逃出华容道</p>
        <button class="primary" id="ov-action">开始游戏</button>
      </div>
    </div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">拖拽方块移动 · 选中后可用方向键 · 曹 走到出口即胜</div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 4;
  var ROWS = 5;
  var CELL = 70;
  var BASE_SCORE = 2000;
  var MOVE_PENALTY = 8;

  // 经典「横刀立马」初始布局
  var INITIAL = [
    { id: 'cao',   name: '曹', type: 'cao',        top: 0, left: 1, rows: 2, cols: 2 },
    { id: 'zhang', name: '张', type: 'general_v', top: 0, left: 0, rows: 2, cols: 1 },
    { id: 'zhao',  name: '赵', type: 'general_v', top: 0, left: 3, rows: 2, cols: 1 },
    { id: 'ma',    name: '马', type: 'general_v', top: 2, left: 0, rows: 2, cols: 1 },
    { id: 'huang', name: '黄', type: 'general_v', top: 2, left: 3, rows: 2, cols: 1 },
    { id: 'guan',  name: '关', type: 'general_h', top: 2, left: 1, rows: 1, cols: 2 },
    { id: 'b1', name: '兵', type: 'soldier', top: 3, left: 1, rows: 1, cols: 1 },
    { id: 'b2', name: '兵', type: 'soldier', top: 3, left: 2, rows: 1, cols: 1 },
    { id: 'b3', name: '兵', type: 'soldier', top: 4, left: 0, rows: 1, cols: 1 },
    { id: 'b4', name: '兵', type: 'soldier', top: 4, left: 3, rows: 1, cols: 1 }
  ];

  var boardEl = document.getElementById('board');
  var movesEl = document.getElementById('moves');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var pieces = [];
  var pieceEls = {};
  var selected = null;
  var moves = 0;
  var score = 0;
  var best = 0;
  var lastReported = -1;
  var state = 'ready';
  var finished = false;

  /** 与原生容器通信；容器不存在时静默忽略。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateStats() {
    movesEl.textContent = String(moves);
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  function layout() {
    // 根据可用宽度自适应单元格尺寸
    var stage = document.querySelector('.stage');
    var w = Math.min(stage.clientWidth - 16, 360);
    CELL = Math.floor(w / COLS);
    boardEl.style.width = (COLS * CELL) + 'px';
    boardEl.style.height = (ROWS * CELL) + 'px';
    var bg = document.createElement('div');
    bg.className = 'grid-bg';
    bg.style.gridTemplateColumns = 'repeat(' + COLS + ', 1fr)';
    bg.style.gridTemplateRows = 'repeat(' + ROWS + ', 1fr)';
    bg.innerHTML = '';
    for (var i = 0; i < COLS * ROWS; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      bg.appendChild(cell);
    }
    boardEl.innerHTML = '';
    boardEl.appendChild(bg);
    // 出口标记：在底部 col 1-2
    var exit = document.createElement('div');
    exit.className = 'exit-mark';
    exit.style.left = (CELL) + 'px';
    exit.style.width = (CELL * 2) + 'px';
    boardEl.appendChild(exit);
    pieceEls = {};
    for (var p = 0; p < pieces.length; p++) {
      var piece = pieces[p];
      var btn = document.createElement('button');
      btn.className = 'piece ' + piece.type;
      btn.textContent = piece.name;
      btn.setAttribute('data-id', piece.id);
      btn.style.width = (piece.cols * CELL - 6) + 'px';
      btn.style.height = (piece.rows * CELL - 6) + 'px';
      btn.style.transform = 'translate(' + (piece.left * CELL + 3) + 'px, ' + (piece.top * CELL + 3) + 'px)';
      boardEl.appendChild(btn);
      pieceEls[piece.id] = btn;
    }
  }

  function occupancy(excludeId) {
    var grid = [];
    for (var r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(null));
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.id === excludeId) continue;
      for (var r = p.top; r < p.top + p.rows; r++) {
        for (var c = p.left; c < p.left + p.cols; c++) {
          grid[r][c] = p.id;
        }
      }
    }
    return grid;
  }

  function canMove(piece, dr, dc) {
    var nt = piece.top + dr;
    var nl = piece.left + dc;
    if (nt < 0 || nl < 0) return false;
    if (nt + piece.rows > ROWS) return false;
    if (nl + piece.cols > COLS) return false;
    var grid = occupancy(piece.id);
    for (var r = nt; r < nt + piece.rows; r++) {
      for (var c = nl; c < nl + piece.cols; c++) {
        if (grid[r][c]) return false;
      }
    }
    return true;
  }

  function movePiece(piece, dr, dc) {
    if (!canMove(piece, dr, dc)) return false;
    piece.top += dr;
    piece.left += dc;
    var el = pieceEls[piece.id];
    if (el) {
      el.style.transform = 'translate(' + (piece.left * CELL + 3) + 'px, ' + (piece.top * CELL + 3) + 'px)';
    }
    moves++;
    updateStats();
    if (checkWin()) onWin();
    return true;
  }

  function checkWin() {
    var cao = pieces.find(function (p) { return p.id === 'cao'; });
    if (!cao) return false;
    return cao.top === 3 && cao.left === 1;
  }

  function onWin() {
    var bonus = Math.max(200, BASE_SCORE - moves * MOVE_PENALTY);
    score += bonus;
    if (score > best) { best = score; reportScore(score); }
    updateStats();
    finished = true;
    gameOver();
  }

  function gameOver() {
    state = 'over';
    reportScore(score);
    send({ type: 'gameOver', score: score, result: 'win' });
    showOverlay(
      '曹 操 逃 出 华 容 道！',
      '共 ' + moves + ' 步 · 得分 ' + score,
      '退出游戏'
    );
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.textContent = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() { overlayEl.classList.add('hidden'); }

  function resetState() {
    pieces = INITIAL.map(function (p) {
      return { id: p.id, name: p.name, type: p.type, top: p.top, left: p.left, rows: p.rows, cols: p.cols };
    });
    selected = null;
  }

  function startGame() {
    hideOverlay();
    resetState();
    moves = 0;
    score = 0;
    lastReported = -1;
    finished = false;
    layout();
    updateStats();
    state = 'playing';
  }

  function restartCurrent() {
    if (state !== 'playing') { startGame(); return; }
    score = Math.max(0, score - 50);
    lastReported = -1;
    resetState();
    layout();
    updateStats();
  }

  function exitGame() {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  }

  function selectPiece(piece) {
    selected = piece;
    for (var id in pieceEls) {
      pieceEls[id].classList.toggle('selected', id === piece.id);
    }
  }

  function clearSelection() {
    selected = null;
    for (var id in pieceEls) {
      pieceEls[id].classList.remove('selected');
    }
  }

  ovActionEl.addEventListener('click', function () {
    if (state === 'over') { exitGame(); } else { startGame(); }
  });
  document.getElementById('restart').addEventListener('click', restartCurrent);
  document.getElementById('exit').addEventListener('click', exitGame);

  // 拖拽逻辑
  var drag = null;
  boardEl.addEventListener('pointerdown', function (event) {
    if (state !== 'playing') return;
    var target = event.target;
    while (target && target !== boardEl && !target.classList.contains('piece')) {
      target = target.parentNode;
    }
    if (!target || !target.classList || !target.classList.contains('piece')) {
      clearSelection();
      return;
    }
    var id = target.getAttribute('data-id');
    var piece = pieces.find(function (p) { return p.id === id; });
    if (!piece) return;
    selectPiece(piece);
    drag = { id: id, startX: event.clientX, startY: event.clientY, threshold: CELL * 0.5 };
    target.setPointerCapture(event.pointerId);
  });

  boardEl.addEventListener('pointermove', function (event) {
    if (!drag || state !== 'playing') return;
    var piece = pieces.find(function (p) { return p.id === drag.id; });
    if (!piece) return;
    var dx = event.clientX - drag.startX;
    var dy = event.clientY - drag.startY;
    var absX = Math.abs(dx);
    var absY = Math.abs(dy);
    if (absX < drag.threshold && absY < drag.threshold) return;
    var moved = false;
    if (absX > absY) {
      moved = movePiece(piece, 0, dx > 0 ? 1 : -1);
    } else {
      moved = movePiece(piece, dy > 0 ? 1 : 0, 0);
    }
    if (moved) {
      // 重置起点，允许连续拖动
      drag.startX = event.clientX;
      drag.startY = event.clientY;
    }
  });

  boardEl.addEventListener('pointerup', function () { drag = null; });
  boardEl.addEventListener('pointercancel', function () { drag = null; });

  // 键盘：先点选某个方块，再用方向键
  document.addEventListener('keydown', function (event) {
    if (state !== 'playing' || !selected) return;
    var dr = 0, dc = 0;
    if (event.code === 'ArrowUp' || event.code === 'KeyW') dr = -1;
    else if (event.code === 'ArrowDown' || event.code === 'KeyS') dr = 1;
    else if (event.code === 'ArrowLeft' || event.code === 'KeyA') dc = -1;
    else if (event.code === 'ArrowRight' || event.code === 'KeyD') dc = 1;
    else return;
    event.preventDefault();
    movePiece(selected, dr, dc);
  });

  window.addEventListener('resize', function () { if (state === 'playing') layout(); });

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; updateStats(); }
      }
      if (message.type === 'restart') { startGame(); }
    }
  };

  resetState();
  layout();
  updateStats();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
