<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>见缝插针</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#f472b6; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  .scores { display:flex; gap:8px; }
  .score-box { background:var(--panel); border-radius:8px; padding:6px 14px; text-align:center; min-width:72px; }
  .score-box span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .score-box strong { display:block; font-size:clamp(16px,4.5vw,22px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; aspect-ratio:4/3; border-radius:12px; background:#111827; display:block; touch-action:none; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.82);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:20px; }
  .card h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card p { margin:0 0 16px; font-size:14px; color:var(--muted); }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#500724;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">见缝插针</div>
    <div class="scores">
      <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
      <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay">
      <div class="card">
        <h2 id="ov-title">见缝插针</h2>
        <p id="ov-desc">点击屏幕，把针插进旋转圆盘的缝隙里</p>
        <button class="primary" id="ov-action">开始游戏</button>
      </div>
    </div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">点击屏幕或按空格插针 · 别撞到已有的针</div>
</div>

<script>
(function () {
  'use strict';

  var NEEDLE_THRESHOLD = 0.145;   // 与已有针的最小角距（弧度），越小越难
  var ROT_BASE = 1.4;             // 初始角速度（弧度/秒）

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var VW = 360, VH = 270;
  var needles = [];               // 圆盘局部角度
  var rotation = 0;               // 圆盘当前旋转角
  var score = 0, best = 0, lastReported = -1;
  var state = 'ready';            // ready | playing | over
  var paused = false, lastTime = 0, rafId = null;
  var flash = 0;                  // 插针成功的高亮动画 0..1
  var failed = false;

  /** 与原生容器通信；容器不存在时静默忽略（例如在浏览器里直接打开）。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常，不影响游戏本身 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateScores() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  function norm(a) {
    a = a % (Math.PI * 2);
    return a < 0 ? a + Math.PI * 2 : a;
  }

  function angDist(a, b) {
    var d = Math.abs(norm(a) - norm(b)) % (Math.PI * 2);
    return Math.min(d, Math.PI * 2 - d);
  }

  function geom() {
    var R = Math.min(VW, VH) * 0.16;
    return { cx: VW / 2, cy: VH * 0.40, R: R, len: R * 1.75 };
  }

  function rotSpeed() {
    return Math.min(4.6, ROT_BASE + needles.length * 0.07);
  }

  function shoot() {
    if (state !== 'playing' || paused) return;
    var local = norm(Math.PI / 2 - rotation);   // 底部方向对应的局部角
    for (var i = 0; i < needles.length; i++) {
      if (angDist(local, needles[i]) < NEEDLE_THRESHOLD) {
        failed = true;
        gameOver();
        return;
      }
    }
    needles.push(local);
    score += 10;
    if (score > best) { best = score; reportScore(score); }
    updateScores();
    flash = 1;
  }

  function update(dt) {
    if (state === 'playing') rotation = norm(rotation + rotSpeed() * dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 3.5);
  }

  function gameOver() {
    state = 'over';
    reportScore(score);
    showOverlay(
      failed ? '插到针了' : '游戏结束',
      '共插入 ' + needles.length + ' 根 · 得分 ' + score,
      '再来一局'
    );
  }

  function draw() {
    var g = geom();
    ctx.clearRect(0, 0, VW, VH);
    var bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#0b1220');
    bg.addColorStop(1, '#111827');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, VH);

    ctx.lineCap = 'round';

    // 已插入的针（先画针，圆盘盖住根部）
    for (var i = 0; i < needles.length; i++) {
      var a = needles[i] + rotation;
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(g.cx + Math.cos(a) * g.R * 0.3, g.cy + Math.sin(a) * g.R * 0.3);
      ctx.lineTo(g.cx + Math.cos(a) * (g.R + g.len), g.cy + Math.sin(a) * (g.R + g.len));
      ctx.stroke();
    }

    // 等待发射的针（位于圆盘下方，指向圆心）
    if (state === 'playing' && !failed) {
      var bob = Math.sin(performance.now() / 260) * 3;
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(g.cx, g.cy + g.R + 10 + g.len + bob);
      ctx.lineTo(g.cx, g.cy + g.R + 10 + bob);
      ctx.stroke();
    }

    // 圆盘
    var cg = ctx.createRadialGradient(
      g.cx - g.R * 0.3, g.cy - g.R * 0.35, g.R * 0.2,
      g.cx, g.cy, g.R
    );
    cg.addColorStop(0, '#fb7185');
    cg.addColorStop(1, '#be185d');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.R * 0.16, 0, Math.PI * 2);
    ctx.fill();

    // 成功插针的闪光
    if (flash > 0) {
      ctx.strokeStyle = 'rgba(253,230,138,' + (flash * 0.9).toFixed(2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(g.cx, g.cy, g.R + (1 - flash) * 18, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function frame(now) {
    if (!paused) {
      var dt = lastTime ? Math.min(0.05, (now - lastTime) / 1000) : 0;
      lastTime = now;
      if (state === 'playing' || state === 'over') update(dt);
      draw();
    }
    rafId = requestAnimationFrame(frame);
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    VW = rect.width;
    VH = rect.height;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(VW * dpr);
    canvas.height = Math.round(VH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.textContent = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() { overlayEl.classList.add('hidden'); }

  function startGame() {
    hideOverlay();
    resize();
    needles = [];
    rotation = 0;
    score = 0;
    lastReported = -1;
    flash = 0;
    failed = false;
    updateScores();
    state = 'playing';
    lastTime = 0;
  }

  ovActionEl.addEventListener('click', startGame);
  document.getElementById('restart').addEventListener('click', startGame);
  document.getElementById('exit').addEventListener('click', function () {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  });

  canvas.addEventListener('pointerdown', function (event) {
    event.preventDefault();
    shoot();
  });
  document.addEventListener('keydown', function (event) {
    if (event.code === 'Space' || event.key === ' ') {
      event.preventDefault();
      shoot();
    }
  });

  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    if (!paused) lastTime = 0;
  });
  window.addEventListener('resize', resize);

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; updateScores(); }
      }
    }
  };

  resize();
  updateScores();
  rafId = requestAnimationFrame(frame);
  send({ type: 'ready' });
})();
</script>
</body>
</html>
