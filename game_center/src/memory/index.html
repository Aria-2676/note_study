<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>记忆翻牌</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#009688; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  .stats { display:flex; gap:8px; }
  .stat { background:var(--panel); border-radius:8px; padding:6px 12px; text-align:center; min-width:64px; }
  .stat span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .stat strong { display:block; font-size:clamp(15px,4.2vw,20px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  .grid {
    width:100%; aspect-ratio:1/1; display:grid;
    grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:clamp(6px,2vw,10px);
  }
  .card {
    position:relative; border:0; padding:0; background:transparent;
    perspective:600px; cursor:pointer;
  }
  .inner {
    position:absolute; inset:0; transition:transform .28s ease;
    transform-style:preserve-3d;
  }
  .card.open .inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:clamp(22px,8vw,40px);
  }
  .back { background:linear-gradient(160deg,#0f766e,#134e4a); color:#5eead4; font-size:clamp(18px,6vw,30px); }
  .front { background:#e2e8f0; transform:rotateY(180deg); }
  .card.done .front { background:#a7f3d0; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.85);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card-box { text-align:center; padding:20px; }
  .card-box h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card-box p { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.7; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#03211f;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">记忆翻牌</div>
    <div class="stats">
      <div class="stat"><span>用时</span><strong id="time">0s</strong></div>
      <div class="stat"><span>步数</span><strong id="moves">0</strong></div>
      <div class="stat"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <div id="grid" class="grid"></div>
    <div id="overlay" class="overlay hidden">
      <div class="card-box">
        <h2 id="ov-title">恭喜通关！</h2>
        <p id="ov-desc"></p>
        <button class="primary" id="ov-action">再来一局</button>
      </div>
    </div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">点开两张相同的牌即可配对</div>
</div>

<script>
(function () {
  'use strict';

  var PAIRS = 8;                 // 4 × 4
  var SYMBOLS = ['🍎', '🍇', '🍉', '🍌', '🍓', '🍒', '🥝', '🍍'];
  var BASE_SCORE = 600;          // 满分（零失误通关）
  var MIN_SCORE = 60;
  var FLIP_BACK_MS = 700;

  var gridEl = document.getElementById('grid');
  var timeEl = document.getElementById('time');
  var movesEl = document.getElementById('moves');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var cards = [];
  var firstIndex = -1;
  var locked = false;
  var moves = 0;
  var matched = 0;
  var seconds = 0;
  var running = false;
  var best = 0;
  var lastReported = -1;
  var timer = null;

  /** 与原生容器通信；容器不存在时静默忽略。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateStats() {
    timeEl.textContent = seconds + 's';
    movesEl.textContent = String(moves);
    bestEl.textContent = String(best);
  }

  function shuffle(list) {
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function buildCards() {
    var deck = [];
    for (var i = 0; i < PAIRS; i++) {
      deck.push({ symbol: SYMBOLS[i], open: false, done: false });
      deck.push({ symbol: SYMBOLS[i], open: false, done: false });
    }
    return shuffle(deck);
  }

  function render() {
    gridEl.innerHTML = '';
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var btn = document.createElement('button');
      btn.className = 'card' + (card.open || card.done ? ' open' : '') + (card.done ? ' done' : '');
      btn.setAttribute('data-index', String(i));

      var inner = document.createElement('div');
      inner.className = 'inner';

      var back = document.createElement('div');
      back.className = 'face back';
      back.textContent = '?';

      var front = document.createElement('div');
      front.className = 'face front';
      front.textContent = card.symbol;

      inner.appendChild(back);
      inner.appendChild(front);
      btn.appendChild(inner);
      gridEl.appendChild(btn);
    }
  }

  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      if (!running) return;
      seconds++;
      updateStats();
    }, 1000);
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function flip(index) {
    if (!running || locked) return;
    var card = cards[index];
    if (card.open || card.done) return;

    card.open = true;
    render();

    if (firstIndex < 0) {
      firstIndex = index;
      return;
    }

    moves++;
    updateStats();
    var firstCard = cards[firstIndex];
    if (firstCard.symbol === card.symbol) {
      firstCard.done = true;
      card.done = true;
      matched++;
      firstIndex = -1;
      render();
      if (matched === PAIRS) finish();
      return;
    }

    locked = true;
    var secondIndex = index;
    setTimeout(function () {
      cards[firstIndex].open = false;
      cards[secondIndex].open = false;
      firstIndex = -1;
      locked = false;
      render();
    }, FLIP_BACK_MS);
  }

  function finish() {
    running = false;
    stopTimer();
    // 失误越少得分越高（PAIRS 步即零失误）
    var penalty = (moves - PAIRS) * 6;
    var score = Math.max(MIN_SCORE, BASE_SCORE - penalty);
    if (score > best) { best = score; updateStats(); }
    reportScore(score);
    showOverlay('恭喜通关！', '用时 ' + seconds + 's · ' + moves + ' 步<br>本局得分 ' + score, '再来一局');
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.innerHTML = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() {
    overlayEl.classList.add('hidden');
  }

  function restart() {
    cards = buildCards();
    firstIndex = -1;
    locked = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    running = true;
    lastReported = -1;
    updateStats();
    hideOverlay();
    render();
    startTimer();
  }

  gridEl.addEventListener('click', function (event) {
    var target = event.target;
    while (target && target !== gridEl && !target.getAttribute('data-index')) {
      target = target.parentNode;
    }
    if (!target || target === gridEl) return;
    flip(parseInt(target.getAttribute('data-index'), 10));
  });

  ovActionEl.addEventListener('click', restart);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('exit').addEventListener('click', function () {
    send({ type: 'exit' });
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopTimer();
    else if (running) startTimer();
  });

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; updateStats(); }
      }
    }
  };

  restart();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
