<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>俄罗斯方块</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#3f51b5; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(20px,6vw,30px); font-weight:800; letter-spacing:1px; }
  .stats { display:flex; gap:8px; }
  .stat { background:var(--panel); border-radius:8px; padding:6px 12px; text-align:center; min-width:60px; }
  .stat span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .stat strong { display:block; font-size:clamp(14px,4vw,19px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { border-radius:12px; background:#111827; display:block; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.85);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card-box { text-align:center; padding:20px; }
  .card-box h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card-box p { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.7; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad button {
    height:50px; border:0; border-radius:10px; background:var(--panel);
    color:var(--text); font-size:18px; font-weight:700;
  }
  .pad button:active { background:#334155; }
  .pad .wide { grid-column:span 2; font-size:15px; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#fff;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">俄罗斯方块</div>
    <div class="stats">
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
      <div class="stat"><span>等级</span><strong id="level">1</strong></div>
      <div class="stat"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="card-box">
        <h2 id="ov-title">游戏结束</h2>
        <p id="ov-desc"></p>
        <button class="primary" id="ov-action">再来一局</button>
      </div>
    </div>
  </div>
  <div class="pad">
    <button data-act="left">◀</button>
    <button data-act="rotate">↻</button>
    <button data-act="right">▶</button>
    <button data-act="down">▼</button>
    <button data-act="drop" class="wide">直落</button>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">旋转、左右移动，填满整行即可消除</div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 10;
  var ROWS = 20;
  var LINE_SCORES = [0, 100, 300, 500, 800];

  var SHAPES = {
    I: { cells: [[1, 1, 1, 1]], color: '#22d3ee' },
    O: { cells: [[1, 1], [1, 1]], color: '#fbbf24' },
    T: { cells: [[0, 1, 0], [1, 1, 1]], color: '#a78bfa' },
    S: { cells: [[0, 1, 1], [1, 1, 0]], color: '#34d399' },
    Z: { cells: [[1, 1, 0], [0, 1, 1]], color: '#f87171' },
    J: { cells: [[1, 0, 0], [1, 1, 1]], color: '#60a5fa' },
    L: { cells: [[0, 0, 1], [1, 1, 1]], color: '#fb923c' }
  };
  var KEYS = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var levelEl = document.getElementById('level');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var board = [];
  var piece = null;
  var cell = 20;
  var score = 0, lines = 0, level = 1;
  var best = 0, lastReported = -1;
  var running = false;
  var dropTimer = null;

  /** 与原生容器通信；容器不存在时静默忽略。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateStats() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    bestEl.textContent = String(best);
  }

  function fitCanvas() {
    var stage = canvas.parentElement.getBoundingClientRect();
    if (!stage.width || !stage.height) return;
    cell = Math.floor(Math.min(stage.width / COLS, stage.height / ROWS));
    if (cell < 6) cell = 6;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = (cell * COLS) + 'px';
    canvas.style.height = (cell * ROWS) + 'px';
    canvas.width = Math.round(cell * COLS * dpr);
    canvas.height = Math.round(cell * ROWS * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < ROWS; r++) {
      var row = [];
      for (var c = 0; c < COLS; c++) row.push(null);
      b.push(row);
    }
    return b;
  }

  function rotate(cells) {
    var rows = cells.length, cols = cells[0].length, out = [];
    for (var c = 0; c < cols; c++) {
      var line = [];
      for (var r = rows - 1; r >= 0; r--) line.push(cells[r][c]);
      out.push(line);
    }
    return out;
  }

  function spawn() {
    var key = KEYS[Math.floor(Math.random() * KEYS.length)];
    var shape = SHAPES[key];
    piece = {
      key: key,
      color: shape.color,
      cells: shape.cells.map(function (row) { return row.slice(); }),
      x: Math.floor((COLS - shape.cells[0].length) / 2),
      y: 0
    };
    if (collide(piece.cells, piece.x, piece.y)) gameOver();
  }

  function collide(cells, ox, oy) {
    for (var r = 0; r < cells.length; r++) {
      for (var c = 0; c < cells[r].length; c++) {
        if (!cells[r][c]) continue;
        var x = ox + c, y = oy + r;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y][x]) return true;
      }
    }
    return false;
  }

  function merge() {
    for (var r = 0; r < piece.cells.length; r++) {
      for (var c = 0; c < piece.cells[r].length; c++) {
        if (!piece.cells[r][c]) continue;
        var y = piece.y + r, x = piece.x + c;
        if (y >= 0 && y < ROWS && x >= 0 && x < COLS) board[y][x] = piece.color;
      }
    }
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      var full = true;
      for (var c = 0; c < COLS; c++) {
        if (!board[r][c]) { full = false; break; }
      }
      if (!full) continue;
      board.splice(r, 1);
      var row = [];
      for (var k = 0; k < COLS; k++) row.push(null);
      board.unshift(row);
      cleared++;
      r++;
    }
    if (!cleared) return;

    lines += cleared;
    score += (LINE_SCORES[cleared] || 0) * level;
    var newLevel = Math.floor(lines / 10) + 1;
    if (newLevel !== level) {
      level = newLevel;
      startDropTimer();
    }
    if (score > best) { best = score; reportScore(score); }
    updateStats();
  }

  function lockPiece() {
    merge();
    clearLines();
    spawn();
    draw();
  }

  function softDrop() {
    if (!running || !piece) return;
    if (!collide(piece.cells, piece.x, piece.y + 1)) {
      piece.y++;
      draw();
    } else {
      lockPiece();
    }
  }

  function hardDrop() {
    if (!running || !piece) return;
    while (!collide(piece.cells, piece.x, piece.y + 1)) piece.y++;
    lockPiece();
  }

  function move(dx) {
    if (!running || !piece) return;
    if (collide(piece.cells, piece.x + dx, piece.y)) return;
    piece.x += dx;
    draw();
  }

  function doRotate() {
    if (!running || !piece) return;
    var rotated = rotate(piece.cells);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collide(rotated, piece.x + kicks[i], piece.y)) {
        piece.cells = rotated;
        piece.x += kicks[i];
        draw();
        return;
      }
    }
  }

  function dropInterval() {
    return Math.max(90, 800 - (level - 1) * 70);
  }

  function startDropTimer() {
    stopDropTimer();
    dropTimer = setInterval(softDrop, dropInterval());
  }

  function stopDropTimer() {
    if (dropTimer) { clearInterval(dropTimer); dropTimer = null; }
  }

  function draw() {
    var w = cell * COLS, h = cell * ROWS;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, w, h);

    // 网格
    ctx.strokeStyle = 'rgba(148,163,184,0.12)';
    ctx.lineWidth = 1;
    for (var c = 1; c < COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * cell, 0); ctx.lineTo(c * cell, h); ctx.stroke();
    }
    for (var r = 1; r < ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * cell); ctx.lineTo(w, r * cell); ctx.stroke();
    }

    // 已落定方块
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (board[y][x]) paintCell(x, y, board[y][x]);
      }
    }

    // 当前方块
    if (piece) {
      for (var pr = 0; pr < piece.cells.length; pr++) {
        for (var pc = 0; pc < piece.cells[pr].length; pc++) {
          if (!piece.cells[pr][pc]) continue;
          paintCell(piece.x + pc, piece.y + pr, piece.color);
        }
      }
    }
  }

  function paintCell(x, y, color) {
    if (y < 0) return;
    ctx.fillStyle = color;
    ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, Math.max(2, cell * 0.18));
  }

  function gameOver() {
    running = false;
    stopDropTimer();
    reportScore(score);
    send({ type: 'gameOver', score: score, result: 'lose' });
    showOverlay('游戏结束', '消除 ' + lines + ' 行 · 得分 ' + score, '退出游戏');
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.innerHTML = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() {
    overlayEl.classList.add('hidden');
  }

  function restart() {
    board = emptyBoard();
    score = 0;
    lines = 0;
    level = 1;
    lastReported = -1;
    piece = null;
    updateStats();
    hideOverlay();
    fitCanvas();
    running = true;
    spawn();
    draw();
    startDropTimer();
  }

  var padEl = document.querySelector('.pad');
  padEl.addEventListener('click', function (event) {
    var target = event.target;
    if (!target.getAttribute || !target.getAttribute('data-act')) return;
    var act = target.getAttribute('data-act');
    if (act === 'left') move(-1);
    else if (act === 'right') move(1);
    else if (act === 'rotate') doRotate();
    else if (act === 'down') softDrop();
    else if (act === 'drop') hardDrop();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft' || event.key === 'a') { event.preventDefault(); move(-1); }
    else if (event.key === 'ArrowRight' || event.key === 'd') { event.preventDefault(); move(1); }
    else if (event.key === 'ArrowDown' || event.key === 's') { event.preventDefault(); softDrop(); }
    else if (event.key === 'ArrowUp' || event.key === 'w') { event.preventDefault(); doRotate(); }
    else if (event.key === ' ') { event.preventDefault(); hardDrop(); }
  });

  function exitGame() {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  }

  ovActionEl.addEventListener('click', exitGame);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('exit').addEventListener('click', exitGame);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopDropTimer();
    else if (running) startDropTimer();
  });

  window.addEventListener('resize', fitCanvas);

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; updateStats(); }
      }
      if (message.type === 'restart') { restart(); }
    }
  };

  restart();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
