<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#4caf50; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  .scores { display:flex; gap:8px; }
  .score-box { background:var(--panel); border-radius:8px; padding:6px 14px; text-align:center; min-width:72px; }
  .score-box span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .score-box strong { display:block; font-size:clamp(16px,4.5vw,22px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; aspect-ratio:1/1; border-radius:12px; background:#111827; display:block; touch-action:none; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.82);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:20px; }
  .card h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card p { margin:0 0 16px; font-size:14px; color:var(--muted); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad button {
    height:50px; border:0; border-radius:10px; background:var(--panel);
    color:var(--accent); font-size:20px; font-weight:700;
  }
  .pad button:active { background:#334155; }
  .pad .spacer { visibility:hidden; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#052e16;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">贪吃蛇</div>
    <div class="scores">
      <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
      <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="ov-title">游戏结束</h2>
        <p id="ov-desc"></p>
        <button class="primary" id="ov-action">再来一局</button>
      </div>
    </div>
  </div>
  <div class="pad">
    <div class="spacer"></div><button data-dir="up">▲</button><div class="spacer"></div>
    <button data-dir="left">◀</button><div class="spacer"></div><button data-dir="right">▶</button>
    <div class="spacer"></div><button data-dir="down">▼</button><div class="spacer"></div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">滑动屏幕或用方向键控制</div>
</div>

<script>
(function () {
  'use strict';

  var GRID = 15;
  var FOOD_SCORE = 10;
  var TICK_MS = 150;

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var snake, dir, nextDir, food, timer, running, score, best = 0, lastReported = -1;

  /** 与原生容器通信；容器不存在时静默忽略（例如在浏览器里直接打开）。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常，不影响游戏本身 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateScores() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    var size = canvas.clientWidth;
    if (!size) return;
    var cell = size / GRID;
    ctx.clearRect(0, 0, size, size);

    // 棋盘格底纹
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = 'rgba(148,163,184,0.06)';
    for (var r = 0; r < GRID; r++) {
      for (var c = 0; c < GRID; c++) {
        if ((r + c) % 2 === 0) ctx.fillRect(c * cell, r * cell, cell, cell);
      }
    }

    // 食物
    ctx.fillStyle = '#f97316';
    roundedRect(food.x * cell + cell * 0.16, food.y * cell + cell * 0.16,
      cell * 0.68, cell * 0.68, cell * 0.22);
    ctx.fill();

    // 蛇身（头更深）
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      ctx.fillStyle = i === 0 ? '#22c55e' : '#4caf50';
      roundedRect(seg.x * cell + cell * 0.08, seg.y * cell + cell * 0.08,
        cell * 0.84, cell * 0.84, cell * 0.22);
      ctx.fill();
    }
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function placeFood() {
    var free = [];
    for (var r = 0; r < GRID; r++) {
      for (var c = 0; c < GRID; c++) {
        var occupied = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === c && snake[i].y === r) { occupied = true; break; }
        }
        if (!occupied) free.push({ x: c, y: r });
      }
    }
    if (!free.length) { food = { x: -1, y: -1 }; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function startLoop() {
    stopLoop();
    timer = setInterval(tick, TICK_MS);
  }

  function setDirection(x, y) {
    if (!running) return;
    if (x === -dir.x && y === -dir.y) return;
    if (x === dir.x && y === dir.y) return;
    nextDir = { x: x, y: y };
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
      gameOver();
      return;
    }
    // 撞到自己（尾巴此刻会让开，故排除最后一节）
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { gameOver(); return; }
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += FOOD_SCORE;
      if (score > best) { best = score; reportScore(score); }
      updateScores();
      placeFood();
      if (food.x < 0) {
        running = false;
        stopLoop();
        draw();
        send({ type: 'gameOver', score: score, result: 'win' });
        showOverlay('通关啦！', '整张棋盘都被你占满了', '退出游戏');
        return;
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    running = false;
    stopLoop();
    reportScore(score);
    send({ type: 'gameOver', score: score, result: 'lose' });
    showOverlay('游戏结束', '长度 ' + snake.length + ' · 得分 ' + score, '退出游戏');
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.textContent = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() {
    overlayEl.classList.add('hidden');
  }

  function restart() {
    snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    lastReported = -1;
    running = true;
    placeFood();
    updateScores();
    hideOverlay();
    resize();
    startLoop();
  }

  function exitGame() {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  }

  ovActionEl.addEventListener('click', exitGame);
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('exit').addEventListener('click', exitGame);

  var dirButtons = document.querySelectorAll('.pad button[data-dir]');
  for (var b = 0; b < dirButtons.length; b++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        var d = btn.getAttribute('data-dir');
        if (d === 'up') setDirection(0, -1);
        else if (d === 'down') setDirection(0, 1);
        else if (d === 'left') setDirection(-1, 0);
        else setDirection(1, 0);
      });
    })(dirButtons[b]);
  }

  document.addEventListener('keydown', function (event) {
    var map = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };
    var m = map[event.key];
    if (!m) return;
    event.preventDefault();
    setDirection(m[0], m[1]);
  });

  var startX = 0, startY = 0, touching = false;
  canvas.addEventListener('touchstart', function (event) {
    if (event.touches.length !== 1) return;
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
    touching = true;
  }, { passive: true });

  canvas.addEventListener('touchmove', function (event) {
    if (touching) event.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', function (event) {
    if (!touching) return;
    touching = false;
    var touch = event.changedTouches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // 切到后台时暂停，避免回来时蛇已经撞墙
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLoop();
    else if (running) startLoop();
  });

  window.addEventListener('resize', resize);

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; updateScores(); }
      }
      if (message.type === 'restart') { restart(); }
    }
  };

  restart();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
