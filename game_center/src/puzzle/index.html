<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数字拼图</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#10b981; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(22px,7vw,34px); font-weight:800; letter-spacing:1px; }
  .stats { display:flex; gap:8px; }
  .stat { background:var(--panel); border-radius:8px; padding:6px 12px; text-align:center; min-width:62px; }
  .stat span { display:block; font-size:11px; color:var(--muted); letter-spacing:1px; }
  .stat strong { display:block; font-size:clamp(15px,4.2vw,20px); }
  .stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  .grid {
    width:min(86vw, 360px); aspect-ratio:1/1; display:grid; gap:6px;
    background:#0c0a09; padding:8px; border-radius:12px;
    touch-action:manipulation;
  }
  .tile {
    border:0; border-radius:8px; padding:0; margin:0;
    background:linear-gradient(135deg,#34d399,#059669);
    color:#064e3b; font-weight:800; font-size:clamp(20px,7vw,34px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease;
  }
  .tile:active { transform:scale(.96); }
  .tile.empty { background:transparent; cursor:default; }
  .tile.locked { background:#334155; color:#64748b; cursor:default; }
  .overlay {
    position:absolute; inset:0; border-radius:12px; background:rgba(15,23,42,.85);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:20px; }
  .card h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card p { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.7; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#064e3b;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">数字拼图</div>
    <div class="stats">
      <div class="stat"><span>关卡</span><strong id="level">1/3</strong></div>
      <div class="stat"><span>步数</span><strong id="moves">0</strong></div>
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <div id="grid" class="grid"></div>
    <div id="overlay" class="overlay">
      <div class="card">
        <h2 id="ov-title">数字拼图</h2>
        <p id="ov-desc">把数字按 1 到 N 顺序排好，空位移到右下角</p>
        <button class="primary" id="ov-action">开始游戏</button>
      </div>
    </div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">点击空位旁边的方块即可滑动 · 也可用方向键</div>
</div>

<script>
(function () {
  'use strict';

  // 关卡配置：尺寸 + 洗牌次数（控制难度）
  var LEVELS = [
    { size: 3, shuffles: 30 },     // 8-puzzle 易
    { size: 4, shuffles: 80 },     // 15-puzzle 中
    { size: 4, shuffles: 200 }     // 15-puzzle 难
  ];
  var BASE_SCORE = 1000;
  var MOVE_PENALTY = 4;
  var LEVEL_BONUS = 500;

  var gridEl = document.getElementById('grid');
  var levelEl = document.getElementById('level');
  var movesEl = document.getElementById('moves');
  var scoreEl = document.getElementById('score');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var size = 3;
  var tiles = [];          // 一维数组，0 表示空位
  var emptyIdx = 0;
  var level = 0;
  var moves = 0;
  var score = 0;
  var best = 0;
  var lastReported = -1;
  var state = 'ready';
  var finished = false;

  /** 与原生容器通信；容器不存在时静默忽略。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateStats() {
    levelEl.textContent = (level + 1) + '/' + LEVELS.length;
    movesEl.textContent = String(moves);
    scoreEl.textContent = String(score);
  }

  function rc(idx) { return { r: Math.floor(idx / size), c: idx % size }; }
  function idxOf(r, c) { return r * size + c; }

  function neighborsOfEmpty() {
    var p = rc(emptyIdx);
    var out = [];
    if (p.r > 0) out.push(idxOf(p.r - 1, p.c));
    if (p.r < size - 1) out.push(idxOf(p.r + 1, p.c));
    if (p.c > 0) out.push(idxOf(p.r, p.c - 1));
    if (p.c < size - 1) out.push(idxOf(p.r, p.c + 1));
    return out;
  }

  function loadLevel(idx) {
    var cfg = LEVELS[idx];
    size = cfg.size;
    tiles = [];
    for (var i = 1; i < size * size; i++) tiles.push(i);
    tiles.push(0);  // 空位在最后
    emptyIdx = size * size - 1;

    // 从已解状态反向随机移动 shuffles 次，保证可解
    var prev = -1;
    for (var s = 0; s < cfg.shuffles; s++) {
      var nb = neighborsOfEmpty();
      var cand = nb.filter(function (x) { return x !== prev; });
      if (!cand.length) cand = nb;
      var pick = cand[Math.floor(Math.random() * cand.length)];
      tiles[emptyIdx] = tiles[pick];
      tiles[pick] = 0;
      prev = emptyIdx;
      emptyIdx = pick;
    }

    moves = 0;
    render();
    updateStats();
  }

  function render() {
    gridEl.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    gridEl.style.gridTemplateRows = 'repeat(' + size + ', 1fr)';
    gridEl.innerHTML = '';
    for (var i = 0; i < tiles.length; i++) {
      var v = tiles[i];
      var btn = document.createElement('button');
      btn.className = 'tile';
      if (v === 0) {
        btn.classList.add('empty');
        btn.textContent = '';
        btn.disabled = true;
      } else {
        btn.textContent = String(v);
        if (isInPlace(i, v)) btn.classList.add('locked');
      }
      btn.setAttribute('data-idx', String(i));
      gridEl.appendChild(btn);
    }
  }

  function isInPlace(idx, v) {
    return idx === v - 1;
  }

  function tryClick(idx) {
    if (state !== 'playing') return;
    if (idx < 0 || idx >= tiles.length) return;
    if (tiles[idx] === 0) return;
    var nb = neighborsOfEmpty();
    if (nb.indexOf(idx) < 0) return;
    // 滑动：被点击的方块与空位交换
    tiles[emptyIdx] = tiles[idx];
    tiles[idx] = 0;
    emptyIdx = idx;
    moves++;
    updateStats();
    render();
    if (checkWin()) onLevelClear();
  }

  function checkWin() {
    for (var i = 0; i < tiles.length - 1; i++) {
      if (tiles[i] !== i + 1) return false;
    }
    return tiles[tiles.length - 1] === 0;
  }

  function onLevelClear() {
    var bonus = Math.max(100, BASE_SCORE - moves * MOVE_PENALTY) + level * LEVEL_BONUS;
    score += bonus;
    if (score > best) { best = score; reportScore(score); }
    updateStats();

    if (level + 1 < LEVELS.length) {
      level++;
      loadLevel(level);
    } else {
      finished = true;
      gameOver();
    }
  }

  function gameOver() {
    state = 'over';
    reportScore(score);
    send({ type: 'gameOver', score: score, result: 'win' });
    showOverlay(
      '全部通关！',
      '共 ' + LEVELS.length + ' 关 · 累计 ' + score + ' 分',
      '退出游戏'
    );
  }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.textContent = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() { overlayEl.classList.add('hidden'); }

  function startGame() {
    hideOverlay();
    level = 0;
    score = 0;
    moves = 0;
    lastReported = -1;
    finished = false;
    loadLevel(level);
    state = 'playing';
  }

  function restartCurrent() {
    if (state !== 'playing') { startGame(); return; }
    score = Math.max(0, score - 50);
    lastReported = -1;
    loadLevel(level);
  }

  function exitGame() {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  }

  ovActionEl.addEventListener('click', function () {
    if (state === 'over') { exitGame(); } else { startGame(); }
  });
  document.getElementById('restart').addEventListener('click', restartCurrent);
  document.getElementById('exit').addEventListener('click', exitGame);

  gridEl.addEventListener('click', function (event) {
    var target = event.target;
    while (target && target !== gridEl && !target.getAttribute('data-idx')) {
      target = target.parentNode;
    }
    if (!target || target === gridEl) return;
    var idx = parseInt(target.getAttribute('data-idx'), 10);
    tryClick(idx);
  });

  // 方向键：把空位旁的对应方向方块滑入空位
  document.addEventListener('keydown', function (event) {
    if (state !== 'playing') return;
    var p = rc(emptyIdx);
    var target = -1;
    if (event.code === 'ArrowUp' || event.code === 'KeyW') {
      // 把空位下方的方块上移 = 点击空位下方
      if (p.r < size - 1) target = idxOf(p.r + 1, p.c);
    } else if (event.code === 'ArrowDown' || event.code === 'KeyS') {
      if (p.r > 0) target = idxOf(p.r - 1, p.c);
    } else if (event.code === 'ArrowLeft' || event.code === 'KeyA') {
      if (p.c < size - 1) target = idxOf(p.r, p.c + 1);
    } else if (event.code === 'ArrowRight' || event.code === 'KeyD') {
      if (p.c > 0) target = idxOf(p.r, p.c - 1);
    }
    if (target >= 0) { event.preventDefault(); tryClick(target); }
  });

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; }
      }
      if (message.type === 'restart') { startGame(); }
    }
  };

  loadLevel(0);
  updateStats();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
