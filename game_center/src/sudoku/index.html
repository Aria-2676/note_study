<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数独闯关</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#0ea5e9; --text:#e2e8f0; --muted:#94a3b8; --given:#f1f5f9; --error:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;
  }
  #app {
    height:100%; max-width:520px; margin:0 auto;
    padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px;
  }
  header { display:flex; align-items:center; justify-content:space-between; }
  .title { font-size:clamp(20px,6vw,28px); font-weight:800; }
  .stats { display:flex; gap:6px; }
  .stat { background:var(--panel); border-radius:8px; padding:5px 10px; text-align:center; min-width:54px; }
  .stat span { display:block; font-size:10px; color:var(--muted); letter-spacing:1px; }
  .stat strong { display:block; font-size:clamp(13px,3.6vw,18px); }
  .stage { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .grid {
    width:min(92vw, 420px); aspect-ratio:1/1; display:grid;
    grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
    background:#0c0a09; border-radius:8px; padding:4px; gap:1px;
    touch-action:manipulation;
  }
  .cell {
    border:0; padding:0; margin:0; background:var(--panel); color:var(--text);
    font-size:clamp(14px,4.2vw,22px); font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cell.rb { box-shadow:inset 0 -1px 0 #f59e0b; }
  .cell.cb { box-shadow:inset -1px 0 0 #f59e0b; }
  .cell.rb.cb { box-shadow:inset 0 -1px 0 #f59e0b, inset -1px 0 0 #f59e0b; }
  .cell.given { color:var(--given); cursor:default; }
  .cell.sel { background:#0c4a6e !important; }
  .cell.rel { background:#1f2937; }
  .cell.same { background:#155e75; }
  .cell.error { color:var(--error); background:#7f1d1d; }
  .pad { display:grid; grid-template-columns:repeat(10, 1fr); gap:5px; width:min(92vw, 420px); }
  .pad button {
    aspect-ratio:1/1; border:0; border-radius:8px; background:var(--panel);
    color:var(--text); font-size:clamp(14px,4vw,18px); font-weight:700;
  }
  .pad button:active { background:#334155; }
  .pad button.erase { background:#3f1d1d; color:#fca5a5; font-size:12px; }
  .overlay {
    position:absolute; inset:0; border-radius:8px; background:rgba(15,23,42,.85);
    display:flex; align-items:center; justify-content:center; z-index:5;
  }
  .overlay.hidden { display:none; }
  .card { text-align:center; padding:20px; }
  .card h2 { margin:0 0 8px; font-size:clamp(20px,6vw,28px); }
  .card p { margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.7; }
  .ops { display:flex; gap:8px; }
  button.primary {
    flex:1; border:0; border-radius:10px; padding:12px; font-size:15px;
    font-weight:700; background:var(--accent); color:#fff;
  }
  button.ghost {
    flex:0 0 84px; border:0; border-radius:10px; padding:12px;
    font-size:14px; font-weight:600; background:#334155; color:var(--text);
  }
  .hint { text-align:center; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">数独闯关</div>
    <div class="stats">
      <div class="stat"><span>关卡</span><strong id="level">1/3</strong></div>
      <div class="stat"><span>用时</span><strong id="time">0s</strong></div>
      <div class="stat"><span>得分</span><strong id="score">0</strong></div>
    </div>
  </header>
  <div class="stage">
    <div id="grid" class="grid"></div>
    <div class="pad" id="pad"></div>
    <div id="overlay" class="overlay">
      <div class="card">
        <h2 id="ov-title">数独闯关</h2>
        <p id="ov-desc">每行/列/3x3 宫填入 1-9 不重复</p>
        <button class="primary" id="ov-action">开始游戏</button>
      </div>
    </div>
  </div>
  <div class="ops">
    <button class="primary" id="restart">重新开始</button>
    <button class="ghost" id="exit">退出</button>
  </div>
  <div class="hint">点选格子后输入数字 · 重复数字会标红</div>
</div>

<script>
(function () {
  'use strict';

  /** 一个有效解；每局对它做行/列/数字置换产生变体，保证可解。 */
  var SEED = [
    [1,2,3,4,5,6,7,8,9],
    [4,5,6,7,8,9,1,2,3],
    [7,8,9,1,2,3,4,5,6],
    [2,3,4,5,6,7,8,9,1],
    [5,6,7,8,9,1,2,3,4],
    [8,9,1,2,3,4,5,6,7],
    [3,4,5,6,7,8,9,1,2],
    [6,7,8,9,1,2,3,4,5],
    [9,1,2,3,4,5,6,7,8]
  ];
  var DIFFICULTY = [
    { name: '简单', empties: 32 },
    { name: '中等', empties: 46 },
    { name: '困难', empties: 56 }
  ];
  var BASE_SCORE = 1500;
  var TIME_PENALTY = 2;
  var LEVEL_BONUS = 600;

  var gridEl = document.getElementById('grid');
  var padEl = document.getElementById('pad');
  var levelEl = document.getElementById('level');
  var timeEl = document.getElementById('time');
  var scoreEl = document.getElementById('score');
  var overlayEl = document.getElementById('overlay');
  var ovTitleEl = document.getElementById('ov-title');
  var ovDescEl = document.getElementById('ov-desc');
  var ovActionEl = document.getElementById('ov-action');

  var solution = [];
  var puzzle = [];
  var userGrid = [];
  var cellEls = [];
  var selR = -1, selC = -1;
  var level = 0;
  var seconds = 0;
  var timer = null;
  var score = 0;
  var best = 0;
  var lastReported = -1;
  var state = 'ready';
  var finished = false;

  /** 与原生容器通信；容器不存在时静默忽略。 */
  function send(message) {
    try {
      if (window.GameBridge && window.GameBridge.postMessage) {
        window.GameBridge.postMessage(JSON.stringify(message));
      }
    } catch (e) { /* 忽略桥接异常 */ }
  }

  function reportScore(value) {
    if (value <= lastReported) return;
    lastReported = value;
    send({ type: 'reportScore', score: value });
  }

  function updateStats() {
    levelEl.textContent = (level + 1) + '/' + DIFFICULTY.length;
    timeEl.textContent = seconds + 's';
    scoreEl.textContent = String(score);
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function generatePuzzle() {
    var g = SEED.map(function (r) { return r.slice(); });
    // band 内换行
    var rowPerms = [shuffle([0,1,2]), shuffle([0,1,2]), shuffle([0,1,2])];
    var ng = [];
    for (var band = 0; band < 3; band++) {
      for (var k = 0; k < 3; k++) {
        ng.push(g[band * 3 + rowPerms[band][k]].slice());
      }
    }
    // stack 内换列
    var colPerms = [shuffle([0,1,2]), shuffle([0,1,2]), shuffle([0,1,2])];
    var ng2 = ng.map(function (row) {
      var out = [];
      for (var stack = 0; stack < 3; stack++) {
        for (var k = 0; k < 3; k++) {
          out.push(row[stack * 3 + colPerms[stack][k]]);
        }
      }
      return out;
    });
    // band 整体交换
    var bandOrder = shuffle([0,1,2]);
    var ng3 = [];
    for (var b = 0; b < 3; b++) {
      for (var r = 0; r < 3; r++) ng3.push(ng2[bandOrder[b] * 3 + r].slice());
    }
    // stack 整体交换
    var stackOrder = shuffle([0,1,2]);
    var ng4 = ng3.map(function (row) {
      var out = [];
      for (var s = 0; s < 3; s++) {
        for (var c = 0; c < 3; c++) out.push(row[stackOrder[s] * 3 + c]);
      }
      return out;
    });
    // 数字置换
    var digits = shuffle([1,2,3,4,5,6,7,8,9]);
    var ng5 = ng4.map(function (row) {
      return row.map(function (v) { return digits[v - 1]; });
    });
    solution = ng5;

    var empties = DIFFICULTY[level].empties;
    puzzle = solution.map(function (row) { return row.slice(); });
    var positions = [];
    for (var i = 0; i < 81; i++) positions.push(i);
    shuffle(positions);
    for (var e = 0; e < empties; e++) {
      var p = positions[e];
      puzzle[Math.floor(p / 9)][p % 9] = 0;
    }
    userGrid = puzzle.map(function (row) { return row.slice(); });
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    cellEls = [];
    for (var r = 0; r < 9; r++) {
      var row = [];
      for (var c = 0; c < 9; c++) {
        var btn = document.createElement('button');
        btn.className = 'cell';
        if (c % 3 === 2 && c !== 8) btn.classList.add('cb');
        if (r % 3 === 2 && r !== 8) btn.classList.add('rb');
        btn.setAttribute('data-r', String(r));
        btn.setAttribute('data-c', String(c));
        btn.addEventListener('click', (function (rr, cc) {
          return function () { selectCell(rr, cc); };
        })(r, c));
        gridEl.appendChild(btn);
        row.push(btn);
      }
      cellEls.push(row);
    }
    renderCells();
  }

  function renderCells() {
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        var el = cellEls[r][c];
        var v = userGrid[r][c];
        el.textContent = v === 0 ? '' : String(v);
        el.classList.toggle('given', puzzle[r][c] !== 0);
        el.classList.toggle('error', hasConflict(r, c));
      }
    }
    paintRelated();
  }

  function paintRelated() {
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        cellEls[r][c].classList.remove('sel', 'rel', 'same');
      }
    }
    if (selR < 0) return;
    var val = userGrid[selR][selC];
    var boxR = Math.floor(selR / 3) * 3;
    var boxC = Math.floor(selC / 3) * 3;
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        if (r === selR || c === selC || (r >= boxR && r < boxR + 3 && c >= boxC && c < boxC + 3)) {
          cellEls[r][c].classList.add('rel');
        }
        if (val !== 0 && userGrid[r][c] === val) {
          cellEls[r][c].classList.add('same');
        }
      }
    }
    cellEls[selR][selC].classList.add('sel');
  }

  function hasConflict(r, c) {
    var v = userGrid[r][c];
    if (v === 0) return false;
    for (var i = 0; i < 9; i++) {
      if (i !== c && userGrid[r][i] === v) return true;
      if (i !== r && userGrid[i][c] === v) return true;
    }
    var br = Math.floor(r / 3) * 3;
    var bc = Math.floor(c / 3) * 3;
    for (var rr = br; rr < br + 3; rr++) {
      for (var cc = bc; cc < bc + 3; cc++) {
        if ((rr !== r || cc !== c) && userGrid[rr][cc] === v) return true;
      }
    }
    return false;
  }

  function selectCell(r, c) {
    if (state !== 'playing') return;
    selR = r; selC = c;
    renderCells();
  }

  function inputNumber(n) {
    if (state !== 'playing') return;
    if (selR < 0 || selC < 0) return;
    if (puzzle[selR][selC] !== 0) return;
    userGrid[selR][selC] = n;
    renderCells();
    if (checkWin()) onLevelClear();
  }

  function eraseCell() {
    if (state !== 'playing') return;
    if (selR < 0 || selC < 0) return;
    if (puzzle[selR][selC] !== 0) return;
    userGrid[selR][selC] = 0;
    renderCells();
  }

  function checkWin() {
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        if (userGrid[r][c] !== solution[r][c]) return false;
      }
    }
    return true;
  }

  function onLevelClear() {
    var bonus = Math.max(200, BASE_SCORE + level * LEVEL_BONUS - seconds * TIME_PENALTY);
    score += bonus;
    if (score > best) { best = score; reportScore(score); }
    updateStats();
    if (level + 1 < DIFFICULTY.length) {
      level++;
      generatePuzzle();
      buildGrid();
      selR = -1; selC = -1;
      seconds = 0;
    } else {
      finished = true;
      gameOver();
    }
  }

  function gameOver() {
    state = 'over';
    stopTimer();
    reportScore(score);
    send({ type: 'gameOver', score: score, result: 'win' });
    showOverlay(
      '全部通关！',
      '累计 ' + score + ' 分',
      '退出游戏'
    );
  }

  function startTimer() {
    stopTimer();
    timer = setInterval(function () {
      if (state !== 'playing') return;
      seconds++;
      updateStats();
    }, 1000);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function showOverlay(title, desc, action) {
    ovTitleEl.textContent = title;
    ovDescEl.textContent = desc;
    ovActionEl.textContent = action;
    overlayEl.classList.remove('hidden');
  }
  function hideOverlay() { overlayEl.classList.add('hidden'); }

  function startGame() {
    hideOverlay();
    level = 0;
    score = 0;
    seconds = 0;
    lastReported = -1;
    finished = false;
    generatePuzzle();
    buildGrid();
    selR = -1; selC = -1;
    updateStats();
    state = 'playing';
    startTimer();
  }

  function restartCurrent() {
    if (state !== 'playing') { startGame(); return; }
    score = Math.max(0, score - 50);
    lastReported = -1;
    generatePuzzle();
    buildGrid();
    selR = -1; selC = -1;
    seconds = 0;
    updateStats();
  }

  function exitGame() {
    if (score > 0) reportScore(score);
    send({ type: 'exit' });
  }

  // 数字键盘
  padEl.innerHTML = '';
  for (var n = 1; n <= 9; n++) {
    (function (nn) {
      var b = document.createElement('button');
      b.textContent = String(nn);
      b.addEventListener('click', function () { inputNumber(nn); });
      padEl.appendChild(b);
    })(n);
  }
  var eraseBtn = document.createElement('button');
  eraseBtn.className = 'erase';
  eraseBtn.textContent = '擦除';
  eraseBtn.addEventListener('click', eraseCell);
  padEl.appendChild(eraseBtn);

  ovActionEl.addEventListener('click', function () {
    if (state === 'over') { exitGame(); } else { startGame(); }
  });
  document.getElementById('restart').addEventListener('click', restartCurrent);
  document.getElementById('exit').addEventListener('click', exitGame);

  document.addEventListener('keydown', function (event) {
    if (state !== 'playing') return;
    var code = event.code;
    if (code.indexOf('Digit') === 0) {
      var d = parseInt(code.slice(5), 10);
      if (d >= 1 && d <= 9) inputNumber(d);
      else if (d === 0) eraseCell();
    } else if (code === 'Backspace' || code === 'Delete') {
      eraseCell();
    } else if (code === 'ArrowUp' && selR > 0) { event.preventDefault(); selectCell(selR - 1, selC); }
    else if (code === 'ArrowDown' && selR < 8) { event.preventDefault(); selectCell(selR + 1, selC); }
    else if (code === 'ArrowLeft' && selC > 0) { event.preventDefault(); selectCell(selR, selC - 1); }
    else if (code === 'ArrowRight' && selC < 8) { event.preventDefault(); selectCell(selR, selC + 1); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopTimer();
    else if (state === 'playing') startTimer();
  });

  /** 接收原生容器下发的消息（最高分、返回等）。 */
  window.__native = {
    onMessage: function (message) {
      if (!message) return;
      if (message.type === 'userInfo' || message.type === 'bestScore') {
        var value = typeof message.bestScore === 'number' ? message.bestScore : 0;
        if (value > best) { best = value; }
      }
      if (message.type === 'restart') { startGame(); }
    }
  };

  generatePuzzle();
  buildGrid();
  updateStats();
  send({ type: 'ready' });
})();
</script>
</body>
</html>
